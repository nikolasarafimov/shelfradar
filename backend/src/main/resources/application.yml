spring:
  application:
    name: ShelfRadar

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shelfradar}
    username: ${DB_USERNAME:shelfradar}
    password: ${DB_PASSWORD:shelfradar}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    issuer: ${JWT_ISSUER:shelfradar-api}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    secret: ${JWT_SECRET}